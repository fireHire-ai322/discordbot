name: Discord Attendance Bot

on:
  schedule:
    # الساعة 3:30 مساءً بتوقيت القاهرة (UTC+3) = الساعة 12:30 UTC
    # من الإثنين للجمعة بس (1-5)
    - cron: '30 12 * * 1-5'

  # تشغيل يدوي من GitHub لو احتجت تشغله في أي وقت
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 6 ساعات و 15 دقيقة (من 3:30 لـ 9:30 + شوية إضافية للأمان)
    timeout-minutes: 375

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
  run: pip install discord.py pytz aiohttp

      - name: Run Discord Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python bot.py
