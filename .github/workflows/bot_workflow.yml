
name: Discord Attendance Bot

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 3:30 PM Cairo — رسالة تنبيه
    - cron: '0 14 * * 1-5'    # 4:00 PM Cairo — فتح الحضور
    - cron: '30 14 * * 1-5'   # 4:30 PM Cairo — تذكير المتأخرين
    - cron: '40 14 * * 1-5'   # 4:40 PM Cairo — التارجت اليومي
    - cron: '0 17 * * 1-5'    # 7:00 PM Cairo — تذكير CRM
    - cron: '30 18 * * 1-5'   # 8:30 PM Cairo — End of Day
    - cron: '0 20 * * 4'      # 8:00 PM Cairo الخميس — تحذير الطرد
    - cron: '30 19 * * 1-5'   # 9:30 PM Cairo — Auto Logout
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: last_state.json
          key: attendance-state-v1
          restore-keys: attendance-state-v1

      - name: Install dependencies
        run: pip install discord.py pytz aiohttp

      - name: Run Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GAS_URL:       ${{ secrets.GAS_URL }}
        run: python bot.py

      - name: Save state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_state.json
          key: attendance-state-v1
